
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Email Masker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
<div class="container">

    <h1>🔐 MYSecurity</h1>
    <p class="sub">Mask your email – keep your identity private.</p>

    <!-- INPUT + BUTTON -->
    <div class="input-group">
      <input type="text" id="emailInput" placeholder="Enter your email..." />
      <button class="btn-mask" id="maskBtn">Mask</button>
    </div>

    <!-- RESULT -->
    <div class="result-box" id="resultBox">
      <div class="result-row">
        <span class="label">Original</span>
        <span class="value" id="originalDisplay">—</span>
      </div>
      <div class="result-row">
        <span class="label">Masked</span>
        <span class="value masked" id="maskedDisplay">—</span>
      </div>
      <div class="result-row">
        <span class="label">Action</span>
        <button class="copy-btn" id="copyBtn">📋 Copy</button>
      </div>
    </div>

  </div>

        <script src-"/script.js"></script>
        
    </body>

</html>
